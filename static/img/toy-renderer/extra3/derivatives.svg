<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">WebGPU 片元导数与切线</title>
  <desc id="desc">左侧是窗口坐标中向右和向下的相邻片元，右侧是它们在三角形表面上对应的两个短向量。</desc>
  <defs>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#e5484d"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1f6fd1"/></marker>
  </defs>
  <rect width="1000" height="420" fill="#eef2f6"/>
  <g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" fill="#222">
    <rect x="24" y="58" width="450" height="338" rx="10" fill="white" stroke="#b8c2cc"/>
    <rect x="526" y="58" width="450" height="338" rx="10" fill="white" stroke="#b8c2cc"/>
    <text x="249" y="36" font-size="18" text-anchor="middle">屏幕上：2×2 个片元一组</text>
    <text x="751" y="36" font-size="18" text-anchor="middle">相机坐标系里：三角形上的两个短向量</text>
    <g fill="#dce8fa" stroke="#99afd0">
      <rect x="110" y="110" width="100" height="100"/>
      <rect x="210" y="110" width="100" height="100"/>
      <rect x="110" y="210" width="100" height="100"/>
      <rect x="210" y="210" width="100" height="100"/>
    </g>
    <g fill="#222">
      <circle cx="160" cy="160" r="5"/><circle cx="260" cy="160" r="5"/>
      <circle cx="160" cy="260" r="5"/><circle cx="260" cy="260" r="5"/>
    </g>
    <path d="M170 160H248" fill="none" stroke="#e5484d" stroke-width="3" marker-end="url(#red)"/>
    <path d="M160 170V248" fill="none" stroke="#1f6fd1" stroke-width="3" marker-end="url(#blue)"/>
    <text x="210" y="95" font-size="16" text-anchor="middle" fill="#e5484d">dpdx：右边减左边</text>
    <text x="325" y="224" font-size="16" fill="#1f6fd1">dpdy</text>
    <text x="325" y="249" font-size="16" fill="#1f6fd1">下面减上面</text>
    <text x="249" y="365" font-size="16" text-anchor="middle">窗口坐标：x 向右，y 向下</text>
    <polygon points="565,300 930,340 785,100" fill="#dce8fa" stroke="#667b99" stroke-width="2"/>
    <circle cx="751" cy="240" r="5"/>
    <path d="M760 242 823 255" fill="none" stroke="#e5484d" stroke-width="3" marker-end="url(#red)"/>
    <path d="M749 250 732 292" fill="none" stroke="#1f6fd1" stroke-width="3" marker-end="url(#blue)"/>
    <text x="827" y="240" font-size="16" fill="#e5484d">dpdx(P)</text>
    <text x="636" y="285" font-size="16" fill="#1f6fd1">dpdy(P)</text>
    <text x="751" y="365" font-size="16" text-anchor="middle">沿着它们走，uv 也会跟着变化</text>
  </g>
</svg>
